<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Scan Absensi QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0f172a;color:#fff;min-height:100vh;max-width:480px;margin:0 auto}

/* LOGIN */
#pgLogin{padding:32px 20px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.logo{text-align:center;margin-bottom:32px}
.logo-icon{font-size:56px;display:block;margin-bottom:12px}
.logo h1{font-size:22px;font-weight:700;color:#60a5fa}
.logo p{font-size:13px;color:#64748b;margin-top:4px}
.inp-wrap{margin-bottom:14px}
.inp-wrap label{display:block;font-size:11px;font-weight:700;color:#475569;margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px}
.inp{width:100%;padding:14px 16px;border:1.5px solid #1e293b;border-radius:10px;background:#1e293b;color:#fff;font-size:16px;outline:none}
.inp:focus{border-color:#2563eb}
.btn-primary{width:100%;padding:16px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}
.btn-primary:disabled{background:#1e3a6e;color:#475569}
.err-box{background:#1c0a0a;border:1px solid #7f1d1d;color:#fca5a5;padding:12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}

/* SCANNER */
#pgScan{display:none;flex-direction:column;min-height:100vh}
.topbar{background:#1e293b;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-brand{font-size:15px;font-weight:700;color:#60a5fa}
.topbar-user{text-align:right}
.topbar-nama{font-size:12px;color:#94a3b8;font-weight:600}
.btn-logout{background:none;border:1px solid #334155;color:#64748b;padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;margin-top:2px;display:block;width:100%}

.scan-body{padding:14px;flex:1}

.counter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.cnt{background:#1e293b;border-radius:10px;padding:10px 6px;text-align:center}
.cnt-num{font-size:26px;font-weight:800;line-height:1}
.cnt-lbl{font-size:9px;color:#475569;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tab{padding:11px;border-radius:10px;border:2px solid #1e293b;background:#1e293b;color:#475569;font-size:13px;font-weight:600;cursor:pointer;text-align:center}
.tab.active{border-color:#2563eb;background:#0f2444;color:#60a5fa}

/* KAMERA */
.cam-section{background:#000;border-radius:14px;overflow:hidden;margin-bottom:12px;position:relative;min-height:260px}
#video{width:100%;height:260px;object-fit:cover;display:block}
#canvas{display:none}
.cam-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.cam-box{width:200px;height:200px;border:3px solid #fff;border-radius:12px;position:relative;box-shadow:0 0 0 9999px rgba(0,0,0,0.4)}
.cam-box::before{content:'';position:absolute;top:-3px;left:-3px;width:24px;height:24px;border-top:4px solid #2563eb;border-left:4px solid #2563eb;border-radius:4px 0 0 0}
.cam-box::after{content:'';position:absolute;bottom:-3px;right:-3px;width:24px;height:24px;border-bottom:4px solid #2563eb;border-right:4px solid #2563eb;border-radius:0 0 4px 0}
.scan-line{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#2563eb,transparent);animation:scanLine 2s linear infinite}
@keyframes scanLine{0%{top:0}100%{top:100%}}

.cam-status{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:#94a3b8;background:rgba(0,0,0,0.5);padding:4px}

.cam-btns{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:12px}
.cam-btn{padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-start{background:#2563eb;color:#fff;grid-column:1/-1}
.btn-stop{background:#334155;color:#94a3b8}
.btn-flip{background:#334155;color:#94a3b8;padding:12px 14px}

.manual-wrap{display:flex;gap:8px;margin-bottom:10px}
.manual-inp{flex:1;padding:11px 14px;border:1.5px solid #1e293b;border-radius:10px;background:#1e293b;color:#fff;font-size:15px;outline:none}
.manual-inp:focus{border-color:#2563eb}
.manual-btn{padding:11px 16px;border:none;border-radius:10px;background:#334155;color:#fff;font-size:18px;cursor:pointer}

/* RESULT */
.result{border-radius:14px;padding:20px;text-align:center;display:none;animation:fadeUp .3s ease;margin-bottom:10px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.result.ok{background:#052e16;border:2px solid #166534}
.result.warn{background:#1c1400;border:2px solid #854d0e}
.result.fail{background:#1c0505;border:2px solid #7f1d1d}
.r-icon{font-size:48px;display:block;margin-bottom:8px}
.r-nama{font-size:21px;font-weight:800;margin-bottom:3px}
.r-kelas{font-size:12px;color:#64748b;margin-bottom:12px}
.r-status{font-size:28px;font-weight:900;letter-spacing:1px;margin-bottom:6px}
.s-hadir{color:#4ade80}.s-telat{color:#fbbf24}.s-fail{color:#f87171}
.r-time{font-size:11px;color:#475569;margin-bottom:14px}
.btn-next{width:100%;padding:13px;border:1.5px solid #334155;border-radius:10px;background:transparent;color:#64748b;font-size:14px;font-weight:600;cursor:pointer}

.processing{text-align:center;padding:20px;color:#475569;font-size:14px;display:none}
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="pgLogin">
  <div class="logo">
    <span class="logo-icon">📱</span>
    <h1>Absensi QR</h1>
    <p>Sistem Kehadiran Sekolah</p>
  </div>
  <div class="err-box" id="errBox"></div>
  <div class="inp-wrap">
    <label>Username</label>
    <input class="inp" type="text" id="u" placeholder="Masukkan username" autocapitalize="none" autocomplete="username">
  </div>
  <div class="inp-wrap">
    <label>Password</label>
    <input class="inp" type="password" id="p" placeholder="Masukkan password" autocomplete="current-password">
  </div>
  <button class="btn-primary" id="btnLogin" onclick="doLogin()">Masuk</button>
  <p style="text-align:center;font-size:11px;color:#334155;margin-top:16px">Sistem Absensi QR &bull; 2026</p>
</div>

<!-- ── SCANNER ── -->
<div id="pgScan">
  <div class="topbar">
    <div class="topbar-brand">📷 Scanner QR</div>
    <div class="topbar-user">
      <div class="topbar-nama" id="uNama">-</div>
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>
  </div>

  <div class="scan-body">
    <div class="counter">
      <div class="cnt"><div class="cnt-num" id="cH" style="color:#4ade80">0</div><div class="cnt-lbl">Hadir</div></div>
      <div class="cnt"><div class="cnt-num" id="cT" style="color:#fbbf24">0</div><div class="cnt-lbl">Terlambat</div></div>
      <div class="cnt"><div class="cnt-num" id="cX" style="color:#60a5fa">0</div><div class="cnt-lbl">Total</div></div>
    </div>

    <div class="mode-tabs">
      <div class="tab active" id="tabM" onclick="setMode('masuk')">➡️ Absen Masuk</div>
      <div class="tab" id="tabP" onclick="setMode('pulang')">⬅️ Absen Pulang</div>
    </div>

    <!-- Kamera langsung via getUserMedia — bukan iframe -->
    <div class="cam-section">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div class="cam-overlay">
        <div class="cam-box"><div class="scan-line"></div></div>
      </div>
      <div class="cam-status" id="camStatus">Tekan Mulai Scan</div>
    </div>

    <div class="cam-btns">
      <button class="cam-btn btn-start" id="btnStart" onclick="startScan()">📷 Mulai Scan Kamera</button>
      <button class="cam-btn btn-stop" id="btnStop" onclick="stopScan()" style="display:none">⏹ Stop</button>
      <button class="cam-btn btn-flip" id="btnFlip" onclick="flipCam()" style="display:none">🔄</button>
    </div>

    <div class="manual-wrap">
      <input class="manual-inp" type="text" id="manualTok" placeholder="Atau ketik token manual..." onkeydown="if(event.key==='Enter')scanManual()">
      <button class="manual-btn" onclick="scanManual()">➤</button>
    </div>

    <div class="processing" id="processing">⏳ Memproses absensi...</div>
    <div class="result" id="result"></div>
  </div>
</div>

<script>
// ── KONFIGURASI ────────────────────────────────────────────
// GANTI URL_GAS dengan URL deployment Anda
var URL_GAS = 'https://script.google.com/macros/s/AKfycbwI9BZgwClDm3E1Be6_Vf_OjLKczKzYM0KXt2_w-9V3JowDR9XnTXV3bUHN07dC7OOR/exec';

var TOKEN = '';
var SESSION = {};
var _mode = 'masuk';
var _stream = null;
var _scanning = false;
var _processing = false;
var _facingMode = 'environment'; // kamera belakang
var _scanInterval = null;
var _cnt = {h:0,t:0,x:0};

// ── API via FETCH (bukan google.script.run) ────────────────
function api(action, params, cb) {
  var body = JSON.stringify({action:action, params:params||{}, token:TOKEN});
  fetch(URL_GAS, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: body
  })
  .then(function(r){ return r.json(); })
  .then(function(data){ cb(data); })
  .catch(function(e){ cb({success:false, message:'Network error: '+e.message}); });
}

// ── LOGIN ──────────────────────────────────────────────────
function doLogin() {
  var u = document.getElementById('u').value.trim();
  var p = document.getElementById('p').value;
  var btn = document.getElementById('btnLogin');
  if(!u||!p){ showErr('Username dan password wajib diisi'); return; }
  btn.disabled=true; btn.textContent='Memproses...';
  hideErr();
  api('login',{username:u,password:p},function(res){
    btn.disabled=false; btn.textContent='Masuk';
    if(res&&res.success){
      TOKEN=res.data.token; SESSION=res.data;
      document.getElementById('uNama').textContent=res.data.nama;
      document.getElementById('pgLogin').style.display='none';
      document.getElementById('pgScan').style.display='flex';
    } else {
      showErr(res?res.message:'Login gagal. Coba lagi.');
    }
  });
}

function showErr(msg){ var el=document.getElementById('errBox'); el.textContent=msg; el.style.display='block'; }
function hideErr(){ document.getElementById('errBox').style.display='none'; }

document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&document.getElementById('pgLogin').style.display!=='none') doLogin();
});

function doLogout(){
  stopScan(); TOKEN=''; SESSION={};
  document.getElementById('pgScan').style.display='none';
  document.getElementById('pgLogin').style.display='flex';
  document.getElementById('u').value='';
  document.getElementById('p').value='';
  document.getElementById('result').style.display='none';
}

// ── MODE ───────────────────────────────────────────────────
function setMode(m){
  _mode=m;
  document.getElementById('tabM').className='tab'+(m==='masuk'?' active':'');
  document.getElementById('tabP').className='tab'+(m==='pulang'?' active':'');
  hideResult();
}

// ── KAMERA via getUserMedia ────────────────────────────────
function startScan(){
  hideResult();
  setCamStatus('Membuka kamera...');
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: _facingMode, width:{ideal:1280}, height:{ideal:720} },
    audio: false
  })
  .then(function(stream){
    _stream = stream;
    _scanning = true;
    var video = document.getElementById('video');
    video.srcObject = stream;
    video.play();
    document.getElementById('btnStart').style.display='none';
    document.getElementById('btnStop').style.display='';
    document.getElementById('btnFlip').style.display='';
    setCamStatus('Arahkan kamera ke QR Code siswa');
    // Mulai scan frame setiap 500ms
    _scanInterval = setInterval(scanFrame, 500);
  })
  .catch(function(e){
    setCamStatus('Gagal: '+e.message);
    alert('Izinkan akses kamera di browser, lalu coba lagi.\n\nError: '+e.message);
  });
}

function stopScan(){
  _scanning=false;
  clearInterval(_scanInterval);
  if(_stream){ _stream.getTracks().forEach(function(t){t.stop();}); _stream=null; }
  var video=document.getElementById('video');
  video.srcObject=null;
  document.getElementById('btnStart').style.display='';
  document.getElementById('btnStop').style.display='none';
  document.getElementById('btnFlip').style.display='none';
  setCamStatus('Tekan Mulai Scan');
}

function flipCam(){
  _facingMode = _facingMode==='environment'?'user':'environment';
  stopScan();
  setTimeout(startScan, 300);
}

function setCamStatus(msg){ document.getElementById('camStatus').textContent=msg; }

// ── SCAN FRAME via jsQR ────────────────────────────────────
function scanFrame(){
  if(!_scanning||_processing) return;
  var video=document.getElementById('video');
  if(!video.videoWidth) return;
  var canvas=document.getElementById('canvas');
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  var ctx=canvas.getContext('2d');
  ctx.drawImage(video,0,0);
  var imageData=ctx.getImageData(0,0,canvas.width,canvas.height);
  // Gunakan jsQR jika tersedia
  if(typeof jsQR !== 'undefined'){
    var code=jsQR(imageData.data,imageData.width,imageData.height,{inversionAttempts:'dontInvert'});
    if(code&&code.data){
      _processing=true;
      onScan(code.data);
    }
  }
}

function scanManual(){
  var t=document.getElementById('manualTok').value.trim();
  if(!t||_processing) return;
  document.getElementById('manualTok').value='';
  _processing=true;
  onScan(t);
}

// ── PROSES ABSENSI ─────────────────────────────────────────
function onScan(token){
  hideResult();
  document.getElementById('processing').style.display='block';
  setCamStatus('Memproses...');
  var action=_mode==='pulang'?'scan_pulang':'scan_qr';
  api(action,{token:token,petugas_id:SESSION.user_id,device:'HP-Firefox'},function(r){
    _processing=false;
    document.getElementById('processing').style.display='none';
    setCamStatus('Arahkan kamera ke QR Code siswa');
    tampilHasil(r);
  });
}

function tampilHasil(r){
  var el=document.getElementById('result');
  el.style.display='block';
  if(!r||!r.success){
    el.className='result fail';
    el.innerHTML='<span class="r-icon">❌</span><div class="r-status s-fail">DITOLAK</div><div class="r-time">'+(r?r.message:'Gagal menghubungi server')+'</div><button class="btn-next" onclick="resetScan()">🔄 Coba Lagi</button>';
    return;
  }
  var d=r.data;
  if(d.duplikat){
    el.className='result warn';
    el.innerHTML='<span class="r-icon">⚠️</span><div class="r-nama">'+d.nama+'</div><div class="r-kelas">'+d.kelas+'</div><div class="r-status s-telat">SUDAH ABSEN</div><div class="r-time">Sebelumnya: '+(d.jam_lama||d.jam_pulang||'-')+'</div><button class="btn-next" onclick="resetScan()">🔄 Scan Berikutnya</button>';
    return;
  }
  var icon=d.status==='PULANG'?'👋':d.status==='HADIR'?'✅':'⏰';
  var cls=d.status==='HADIR'||d.status==='PULANG'?'s-hadir':'s-telat';
  el.className='result ok';
  el.innerHTML='<span class="r-icon">'+icon+'</span><div class="r-nama">'+d.nama+'</div><div class="r-kelas">'+d.kelas+' &bull; NIS: '+d.nis+'</div><div class="r-status '+cls+'">'+d.status+'</div><div class="r-time">📅 '+d.tanggal+' &nbsp;🕐 '+(d.jam||'').substring(0,5)+'</div><button class="btn-next" onclick="resetScan()">🔄 Scan Berikutnya</button>';
  if(d.status==='HADIR'){_cnt.h++;document.getElementById('cH').textContent=_cnt.h;}
  if(d.status==='TERLAMBAT'){_cnt.t++;document.getElementById('cT').textContent=_cnt.t;}
  _cnt.x++;document.getElementById('cX').textContent=_cnt.x;
  setTimeout(function(){resetScan();},3500);
}

function hideResult(){ document.getElementById('result').style.display='none'; }
function resetScan(){ hideResult(); _processing=false; }
</script>

<!-- jsQR untuk decode QR dari frame kamera -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.min.js"></script>
</body>
</html>
